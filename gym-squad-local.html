<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gym Squad Local</title>
<style>
:root {
  --accent: #0a84ff; --accent-soft: rgba(10,132,255,0.14);
  --bg: #f2f2f7; --card: #fff; --text: #1c1c1e; --text-2: #6e6e73; --text-3: #aeaeb2;
  --border: rgba(0,0,0,0.07); --shadow: 0 2px 16px rgba(0,0,0,0.06);
  --gold: #ffd60a; --danger: #ff453a; --ease: cubic-bezier(0.32,0.72,0.35,1);
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#000; --card:#1c1c1e; --text:#fff; --text-2:#98989f; --text-3:#636366;
    --border:rgba(255,255,255,0.09); --shadow:0 2px 16px rgba(0,0,0,0.4); }
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
.shell { max-width:560px; margin:0 auto; min-height:100vh; padding:20px 16px 110px; }
h1 { font-size:26px; font-weight:800; letter-spacing:-0.5px; }
h3 { font-size:17px; font-weight:700; }
.card { background:var(--card); border-radius:22px; box-shadow:var(--shadow);
  padding:18px; margin-bottom:14px; border:1px solid var(--border); }
.btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  padding:15px; border:none; border-radius:16px; font-size:16px; font-weight:700;
  font-family:inherit; cursor:pointer; background:var(--accent); color:#fff;
  transition:transform 0.15s var(--ease); }
.btn:active { transform:scale(0.97); }
.btn.secondary { background:var(--accent-soft); color:var(--accent); }
.btn.danger { background:rgba(255,69,58,0.14); color:var(--danger); }
.btn.small { width:auto; padding:9px 16px; font-size:14px; border-radius:12px; }
.input { width:100%; padding:13px 15px; border-radius:14px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:16px; font-family:inherit; outline:none; }
.label { display:block; font-size:13px; font-weight:600; color:var(--text-2); margin:12px 0 6px; }
.row { display:flex; align-items:center; gap:10px; }
.row-between { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.col { display:flex; flex-direction:column; gap:4px; }
.muted { color:var(--text-2); font-size:14px; }
.tiny { color:var(--text-3); font-size:12px; }
.bold { font-weight:700; }
.mt { margin-top:14px; } .mb { margin-bottom:14px; }
.chip { display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:999px;
  font-size:12px; font-weight:600; background:var(--accent-soft); color:var(--accent); }
.list-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
.list-item:last-child { border-bottom:none; }
.tabbar { position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center; z-index:50;
  background:color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom,0); }
.tabbar-inner { display:flex; width:100%; max-width:560px; }
.tabbar button { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:9px 0 7px; border:none; background:transparent; color:var(--text-3);
  font-size:10px; font-weight:600; font-family:inherit; cursor:pointer; }
.tabbar button.active { color:var(--accent); }
.tabbar .ic { font-size:22px; line-height:1; }
.page { display:none; animation:pop 0.25s var(--ease); }
.page.active { display:block; }
@keyframes pop { from { transform:translateY(8px); opacity:0; } to { transform:none; opacity:1; } }
.goal-btn { border:2px solid var(--border); border-radius:16px; padding:11px; cursor:pointer;
  background:var(--card); font-family:inherit; width:100%; text-align:left; font-size:15px; font-weight:700; }
.goal-btn.sel { border-color:var(--gc); color:var(--gc); background:color-mix(in srgb, var(--gc) 10%, var(--card)); }
.cal { display:grid; grid-template-columns:repeat(14,1fr); gap:4px; }
.cal div { aspect-ratio:1; border-radius:4px; background:var(--bg); }
.timer { position:fixed; bottom:calc(env(safe-area-inset-bottom,0) + 74px); left:50%; transform:translateX(-50%);
  z-index:70; background:var(--card); border:1px solid var(--border); border-radius:20px;
  box-shadow:var(--shadow); padding:10px 16px; display:none; align-items:center; gap:12px; }
.timer.on { display:flex; }
#confetti { position:fixed; inset:0; pointer-events:none; z-index:200; }
.toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:300;
  background:var(--card); color:var(--text); padding:11px 18px; border-radius:999px;
  box-shadow:0 6px 24px rgba(0,0,0,0.25); font-size:14px; font-weight:600; display:none; max-width:90vw; }
.big-num { font-size:32px; font-weight:800; letter-spacing:-1px; }
.exrow input { width:74px; text-align:center; padding:10px 6px; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>
<div class="shell">

  <div class="page active" id="p-inicio"></div>
  <div class="page" id="p-entrenar"></div>
  <div class="page" id="p-carrera"></div>
  <div class="page" id="p-progreso"></div>
  <div class="page" id="p-perfil"></div>

</div>

<div class="timer" id="timer">
  <span class="tiny bold">Descanso</span>
  <span id="timer-val" style="font-size:24px;font-weight:800"></span>
  <button class="btn secondary small" onclick="restLeft+=30">+30s</button>
  <button class="btn small" style="background:transparent;color:var(--accent)" onclick="stopRest()">Saltar</button>
</div>

<nav class="tabbar">
  <div class="tabbar-inner">
    <button class="active" data-p="inicio"><span class="ic">🏠</span>Inicio</button>
    <button data-p="entrenar"><span class="ic">🏋️</span>Entrenar</button>
    <button data-p="carrera"><span class="ic">🏃</span>Carrera</button>
    <button data-p="progreso"><span class="ic">📈</span>Progreso</button>
    <button data-p="perfil"><span class="ic">⚙️</span>Perfil</button>
  </div>
</nav>

<script>
// ================== DATOS (localStorage) ==================
// Version local de Gym Squad: todo se guarda en este telefono.
// La version completa (React + Supabase) esta en el repo y agrega
// grupos, rankings, feed, medallas, duelos y sincronizacion.
var GOALS = {
  masa: { label:'Masa muscular', color:'#0A84FF', emoji:'💪' },
  grasa: { label:'Bajar grasa', color:'#30D158', emoji:'🔥' },
  fuerza: { label:'Fuerza', color:'#FF453A', emoji:'🏋️' },
  resistencia: { label:'Resistencia', color:'#40C8E0', emoji:'🏃' },
  recomposicion: { label:'Recomposición', color:'#BF5AF2', emoji:'⚖️' },
}
var ROUTINE = [
  { name:'Push', emoji:'🔵', exercises:['Press banca con barra','Press inclinado con mancuernas','Press de hombros con mancuernas','Elevaciones laterales','Extensión de tríceps en polea'] },
  { name:'Pull', emoji:'🟢', exercises:['Dominadas','Remo con barra','Jalón al pecho','Face pull','Curl con barra'] },
  { name:'Legs', emoji:'🟠', exercises:['Sentadilla con barra','Prensa de pierna','Peso muerto rumano','Extensión de cuádriceps','Elevación de talones de pie'] },
]
var REST_BY_GOAL = { masa:90, grasa:45, fuerza:180, resistencia:60, recomposicion:90 }

var db = JSON.parse(localStorage.getItem('gym-squad-local') || 'null') || {
  profile: { name:'', goal:'masa', weeklyTarget:4 },
  sessions: [], runs: []
}
function save() { localStorage.setItem('gym-squad-local', JSON.stringify(db)) }
function today() { var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function fmtDate(s) { return new Date(s+'T12:00:00').toLocaleDateString('es-DO',{day:'numeric',month:'short'}) }
function esc(s) { return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c] }) }

// ================== UTILIDADES ==================
function toast(msg) {
  var t = document.getElementById('toast')
  t.textContent = msg; t.style.display = 'block'
  clearTimeout(t._h); t._h = setTimeout(function(){ t.style.display='none' }, 2500)
}
function vibrate(p) { if (navigator.vibrate) navigator.vibrate(p) }
function applyAccent() {
  var c = GOALS[db.profile.goal].color
  document.documentElement.style.setProperty('--accent', c)
  document.documentElement.style.setProperty('--accent-soft', c + '24')
}
// Confeti simple en canvas
function confetti() {
  var cv = document.getElementById('confetti'), ctx = cv.getContext('2d')
  cv.width = innerWidth; cv.height = innerHeight
  var cols = ['#FFD60A','#FF9F0A','#0A84FF','#30D158','#BF5AF2','#FF375F']
  var parts = []
  for (var i=0;i<110;i++) parts.push({ x:innerWidth/2, y:innerHeight*0.6,
    vx:(Math.random()-0.5)*11, vy:-Math.random()*13-4,
    s:Math.random()*7+4, c:cols[i%cols.length], r:Math.random()*Math.PI })
  var frames = 0
  ;(function loop(){
    ctx.clearRect(0,0,cv.width,cv.height)
    parts.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.r+=0.1
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s); ctx.restore() })
    if (++frames < 90) requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height)
  })()
}
function parseDur(str) {
  var p = String(str||'').trim().split(':').map(Number)
  if (p.some(isNaN) || !p.length) return null
  if (p.length===1) return p[0]*60
  if (p.length===2) return p[0]*60+p[1]
  return p[0]*3600+p[1]*60+p[2]
}
function fmtDur(s) { var h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=Math.round(s%60)
  return h ? h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0') : m+':'+String(x).padStart(2,'0') }
function fmtPace(s) { if(!s||!isFinite(s)) return '--'; return Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0')+'/km' }

// Records: mejor peso historico por ejercicio
function maxWeight(exName) {
  var max = 0
  db.sessions.forEach(function(s){ s.sets.forEach(function(st){
    if (st.ex===exName && st.weight>max) max = st.weight }) })
  return max
}
function activeDates() {
  var set = {}
  db.sessions.forEach(function(s){ set[s.date]=1 })
  db.runs.forEach(function(r){ set[r.date]=1 })
  return Object.keys(set)
}
function streak() {
  var set = {}; activeDates().forEach(function(d){ set[d]=1 })
  var d = new Date(), n = 0
  function key(x){ return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0') }
  if (!set[key(d)]) d.setDate(d.getDate()-1)
  while (set[key(d)]) { n++; d.setDate(d.getDate()-1) }
  return n
}

// ================== NAVEGACION ==================
var current = 'inicio'
document.querySelectorAll('.tabbar button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.tabbar button').forEach(function(x){ x.classList.remove('active') })
    b.classList.add('active'); current = b.dataset.p; render(); scrollTo(0,0)
  })
})
function render() {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active') })
  var el = document.getElementById('p-'+current)
  el.classList.add('active')
  if (current==='inicio') renderInicio(el)
  if (current==='entrenar') renderEntrenar(el)
  if (current==='carrera') renderCarrera(el)
  if (current==='progreso') renderProgreso(el)
  if (current==='perfil') renderPerfil(el)
}

// ================== INICIO ==================
function ring(r, pct, color) {
  var c = 2*Math.PI*r, v = Math.max(0, Math.min(1, pct))
  return '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+color+'" stroke-opacity="0.18" stroke-width="12"/>'+
    '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(c*v)+' '+c+'" transform="rotate(-90 70 70)"/>'
}
function renderInicio(el) {
  var p = db.profile
  if (!p.name) {
    el.innerHTML = '<h1 class="mb">Bienvenido 💪</h1>'+
      '<div class="card"><label class="label" style="margin-top:0">¿Cómo te llamas?</label>'+
      '<input class="input" id="ob-name" placeholder="Tu nombre" />'+
      '<label class="label">¿Cuál es tu meta?</label><div class="col" style="gap:8px" id="ob-goals"></div>'+
      '<button class="btn mt" onclick="finishOb()">Empezar</button></div>'
    var gc = document.getElementById('ob-goals')
    Object.keys(GOALS).forEach(function(k){
      var g = GOALS[k]
      gc.innerHTML += '<button class="goal-btn'+(p.goal===k?' sel':'')+'" style="--gc:'+g.color+'" onclick="pickGoal(\''+k+'\')">'+g.emoji+' '+g.label+'</button>'
    })
    return
  }
  // Semana actual (lunes a domingo)
  var now = new Date(), dow = now.getDay(), monday = new Date(now)
  monday.setDate(now.getDate() - (dow===0?6:dow-1))
  function inWeek(ds){ var d=new Date(ds+'T12:00:00'); return d>=new Date(monday.toDateString()) }
  var weekDays = activeDates().filter(inWeek).length
  var weekVol = 0
  db.sessions.filter(function(s){ return inWeek(s.date) }).forEach(function(s){
    s.sets.forEach(function(st){ weekVol += st.weight*st.reps }) })
  var cardioMin = db.runs.filter(function(r){ return inWeek(r.date) })
    .reduce(function(a,r){ return a + r.sec/60 }, 0)
  var mes = today().slice(0,7)
  var mVol = 0, mPRs = 0
  db.sessions.filter(function(s){ return s.date.slice(0,7)===mes }).forEach(function(s){
    s.sets.forEach(function(st){ mVol += st.weight*st.reps; if (st.pr) mPRs++ }) })
  var mDays = activeDates().filter(function(d){ return d.slice(0,7)===mes }).length
  var st = streak()
  var volTarget = p.weeklyTarget * 5000

  el.innerHTML =
    '<div class="row-between mb"><div><p class="muted">'+(now.getHours()<12?'Buenos días':now.getHours()<19?'Buenas tardes':'Buenas noches')+'</p>'+
    '<h1>'+esc(p.name)+' '+GOALS[p.goal].emoji+'</h1></div>'+
    (st>0?'<span class="chip" style="font-size:15px">🔥 '+st+'</span>':'')+'</div>'+
    '<div class="card"><div class="row" style="gap:18px">'+
    '<svg width="140" height="140" viewBox="0 0 140 140">'+
    ring(62, weekDays/p.weeklyTarget, '#FF375F')+ring(47, weekVol/volTarget, '#30D158')+ring(32, cardioMin/90, '#40C8E0')+'</svg>'+
    '<div class="col" style="gap:12px;flex:1">'+
    riLabel('#FF375F','Días esta semana', weekDays+'/'+p.weeklyTarget)+
    riLabel('#30D158','Volumen esta semana', (weekVol>=1000?(weekVol/1000).toFixed(1)+'k':Math.round(weekVol))+' lb')+
    riLabel('#40C8E0','Cardio esta semana', Math.round(cardioMin)+' min')+
    '</div></div></div>'+
    '<div class="row mb"><button class="btn" onclick="goTab(\'entrenar\')">🏋️ Entrenar ahora</button>'+
    '<button class="btn secondary" onclick="goTab(\'carrera\')">🏃 Registrar carrera</button></div>'+
    '<p class="tiny" style="text-align:center">Este mes: '+mDays+' días activos, '+(mVol>=1000?(mVol/1000).toFixed(1)+'k':Math.round(mVol))+' lb, '+mPRs+' PRs</p>'
}
function riLabel(color, label, val) {
  return '<div><div class="row" style="gap:6px"><span style="width:10px;height:10px;border-radius:5px;background:'+color+'"></span>'+
    '<span class="tiny bold">'+label+'</span></div><span class="bold" style="font-size:17px">'+val+'</span></div>'
}
function pickGoal(k){ db.profile.goal=k; save(); applyAccent(); render() }
function finishOb(){
  var n = document.getElementById('ob-name').value.trim()
  if (!n) { toast('Escribe tu nombre'); return }
  db.profile.name = n; save(); render()
}
function goTab(p){ document.querySelector('.tabbar button[data-p="'+p+'"]').click() }

// ================== ENTRENAR ==================
var liveDay = null, liveSets = []
function renderEntrenar(el) {
  if (liveDay === null) {
    el.innerHTML = '<h1 class="mb">Entrenar</h1>' + ROUTINE.map(function(d,i){
      return '<button class="card row-between" style="width:100%;cursor:pointer;font-family:inherit;text-align:left" onclick="startDay('+i+')">'+
        '<div class="row"><span style="font-size:28px">'+d.emoji+'</span><div><h3>'+d.name+'</h3>'+
        '<p class="tiny">'+d.exercises.length+' ejercicios</p></div></div><span style="font-size:22px;color:var(--text-3)">›</span></button>'
    }).join('')
    return
  }
  var d = ROUTINE[liveDay]
  el.innerHTML = '<div class="row-between mb"><h1>'+d.emoji+' '+d.name+'</h1>'+
    '<button class="btn small" onclick="finishSession()">'+(liveSets.length?'Terminar':'Salir')+'</button></div>'+
    d.exercises.map(function(ex, i){
      var mine = liveSets.filter(function(s){ return s.ex===ex })
      var best = maxWeight(ex)
      return '<div class="card"><div class="row-between"><h3 style="font-size:15px">'+ex+'</h3><span class="chip">'+mine.length+'</span></div>'+
        (best?'<p class="tiny mt" style="margin-top:6px">Tu récord: '+best+' lb</p>':'')+
        (mine.length?'<div class="mt">'+mine.map(function(s,j){
          return '<div class="list-item" style="padding:6px 0"><span class="tiny" style="width:18px">'+(j+1)+'</span>'+
          '<span class="bold" style="flex:1">'+s.weight+' lb × '+s.reps+'</span>'+(s.pr?'<span>🏆</span>':'')+'</div>' }).join('')+'</div>':'')+
        '<div class="row mt exrow"><input class="input" id="w-'+i+'" type="number" inputmode="decimal" placeholder="lb" />'+
        '<input class="input" id="r-'+i+'" type="number" inputmode="numeric" placeholder="reps" />'+
        '<button class="btn small" style="flex:1" onclick="addSet('+i+')">Guardar serie</button></div></div>'
    }).join('')
}
function startDay(i){ liveDay = i; liveSets = []; render() }
function addSet(i) {
  var ex = ROUTINE[liveDay].exercises[i]
  var w = parseFloat(document.getElementById('w-'+i).value)
  var r = parseInt(document.getElementById('r-'+i).value, 10)
  if (!w || !r) { toast('Pon peso y reps'); return }
  var isPR = w > maxWeight(ex) && liveSets.filter(function(s){ return s.ex===ex && s.weight>=w }).length===0
  liveSets.push({ ex:ex, weight:w, reps:r, pr:isPR })
  persistLive()
  if (isPR) { confetti(); vibrate([40,60,80]); toast('🏆 ¡Récord personal en '+ex+'!') }
  else vibrate(25)
  startRest(REST_BY_GOAL[db.profile.goal])
  render()
}
function persistLive() {
  var d = today()
  var s = db.sessions.find(function(x){ return x.date===d && x.dayName===ROUTINE[liveDay].name })
  if (!s) { s = { id:Date.now(), date:d, dayName:ROUTINE[liveDay].name, sets:[] }; db.sessions.push(s) }
  s.sets = liveSets.slice()
  save()
}
function finishSession() {
  if (liveSets.length) {
    var vol = liveSets.reduce(function(a,s){ return a+s.weight*s.reps }, 0)
    var prs = liveSets.filter(function(s){ return s.pr }).length
    toast('💪 Entreno guardado: '+(vol>=1000?(vol/1000).toFixed(1)+'k':vol)+' lb, '+liveSets.length+' series'+(prs?', '+prs+' PRs':''))
  }
  liveDay = null; liveSets = []; stopRest(); goTab('inicio')
}
// Cronometro de descanso
var restLeft = 0, restInt = null
function startRest(sec) {
  restLeft = sec
  document.getElementById('timer').classList.add('on')
  clearInterval(restInt)
  restInt = setInterval(function(){
    restLeft--
    document.getElementById('timer-val').textContent = Math.floor(restLeft/60)+':'+String(restLeft%60).padStart(2,'0')
    if (restLeft<=0) { stopRest(); vibrate([80,80,200]) }
  }, 1000)
  document.getElementById('timer-val').textContent = Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')
}
function stopRest(){ clearInterval(restInt); document.getElementById('timer').classList.remove('on') }

// ================== CARRERA ==================
function renderCarrera(el) {
  el.innerHTML = '<h1 class="mb">Registrar actividad</h1><div class="card">'+
    '<label class="label" style="margin-top:0">Tipo</label>'+
    '<select class="input" id="run-act"><option value="correr">🏃 Correr</option><option value="bici">🚴 Bici</option>'+
    '<option value="caminata">🚶 Caminata</option><option value="basquet">🏀 Básquet</option></select>'+
    '<label class="label">Distancia (km)</label><input class="input" id="run-km" type="number" inputmode="decimal" placeholder="5.2" />'+
    '<label class="label">Tiempo (mm:ss)</label><input class="input" id="run-t" inputmode="numeric" placeholder="28:15" />'+
    '<label class="label">Ruta (opcional)</label><input class="input" id="run-ruta" placeholder="Malecón 5K" />'+
    '<button class="btn mt" onclick="saveRun()">Guardar</button></div>'+
    (db.runs.length?'<div class="card"><h3 class="mb">Últimas actividades</h3>'+
      db.runs.slice(-8).reverse().map(function(r){
        return '<div class="list-item"><span style="font-size:20px">'+({correr:'🏃',bici:'🚴',caminata:'🚶',basquet:'🏀'}[r.act]||'⚡')+'</span>'+
        '<div class="col" style="flex:1;gap:2px"><span class="bold" style="font-size:14px">'+
        (r.km?r.km+' km':'Sesión')+(r.route?' · '+esc(r.route):'')+'</span>'+
        '<span class="tiny">'+fmtDate(r.date)+' · '+fmtDur(r.sec)+(r.pace?' · '+fmtPace(r.pace):'')+'</span></div></div>'
      }).join('')+'</div>':'')
}
function saveRun() {
  var act = document.getElementById('run-act').value
  var km = parseFloat(document.getElementById('run-km').value) || null
  var sec = parseDur(document.getElementById('run-t').value)
  var route = document.getElementById('run-ruta').value.trim() || null
  if (!sec) { toast('Pon el tiempo en formato mm:ss'); return }
  if (act!=='basquet' && !km) { toast('Pon la distancia'); return }
  var pace = km ? Math.round(sec/km) : null
  // Record de mayor distancia
  var bestKm = db.runs.reduce(function(a,r){ return Math.max(a, r.km||0) }, 0)
  db.runs.push({ date:today(), act:act, km:km, sec:sec, pace:pace, route:route })
  save()
  if (km && km > bestKm && bestKm > 0) { confetti(); vibrate([40,60,80]); toast('🏆 ¡Mayor distancia de tu historia!') }
  else toast('Actividad guardada'+(pace?' · Pace '+fmtPace(pace):''))
  render()
}

// ================== PROGRESO ==================
function renderProgreso(el) {
  // Records de gym por ejercicio
  var recs = {}
  db.sessions.forEach(function(s){ s.sets.forEach(function(st){
    if (!recs[st.ex] || st.weight>recs[st.ex]) recs[st.ex]=st.weight }) })
  var recList = Object.keys(recs).sort()
  // Calendario 8 semanas
  var volByDate = {}
  db.sessions.forEach(function(s){ var v=0; s.sets.forEach(function(st){ v+=st.weight*st.reps })
    volByDate[s.date]=(volByDate[s.date]||0)+v })
  db.runs.forEach(function(r){ volByDate[r.date]=volByDate[r.date]||1 })
  var maxV = Math.max.apply(null, Object.keys(volByDate).map(function(k){ return volByDate[k] }).concat([1]))
  var cells = ''
  var start = new Date(); start.setDate(start.getDate()-55)
  for (var i=0;i<56;i++) {
    var k = start.getFullYear()+'-'+String(start.getMonth()+1).padStart(2,'0')+'-'+String(start.getDate()).padStart(2,'0')
    var v = volByDate[k]||0
    cells += '<div style="'+(v?'background:var(--accent);opacity:'+(0.3+0.7*v/maxV).toFixed(2):'')+'"></div>'
    start.setDate(start.getDate()+1)
  }
  // Records de running (prorrateados)
  function bestEffort(km) {
    var best = null
    db.runs.forEach(function(r){ if (r.act==='correr' && r.km>=km && r.sec) {
      var t = r.sec/r.km*km; if (!best||t<best) best=t } })
    return best
  }
  var r1=bestEffort(1), r5=bestEffort(5), r10=bestEffort(10)
  var maxKm = db.runs.reduce(function(a,r){ return Math.max(a,r.km||0) },0)

  el.innerHTML = '<h1 class="mb">Progreso</h1>'+
    '<div class="card"><h3 class="mb">Calendario (8 semanas)</h3><div class="cal">'+cells+'</div></div>'+
    '<div class="card"><h3 class="mb">🏆 Récords de gym (lb)</h3>'+
    (recList.length?recList.map(function(ex){
      return '<div class="list-item"><span style="flex:1;font-size:14px">'+ex+'</span><span class="bold">'+recs[ex]+' lb</span></div>'
    }).join(''):'<p class="muted">Registra tu primer entreno.</p>')+'</div>'+
    '<div class="card"><h3 class="mb">🏃 Récords de running</h3>'+
    ((r1||r5||r10||maxKm)?
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
      (r1?recBox('Mejor 1K',fmtDur(r1)):'')+(r5?recBox('Mejor 5K',fmtDur(r5)):'')+
      (r10?recBox('Mejor 10K',fmtDur(r10)):'')+(maxKm?recBox('Mayor distancia',maxKm.toFixed(1)+' km'):'')+'</div>'
      :'<p class="muted">Registra tu primera carrera.</p>')+'</div>'
}
function recBox(l,v){ return '<div class="col" style="background:var(--bg);border-radius:14px;padding:12px"><span class="tiny">'+l+'</span><span class="bold" style="font-size:19px">'+v+'</span></div>' }

// ================== PERFIL ==================
function renderPerfil(el) {
  var p = db.profile
  el.innerHTML = '<h1 class="mb">Perfil</h1>'+
    '<div class="card"><label class="label" style="margin-top:0">Nombre</label>'+
    '<input class="input" id="pf-name" value="'+esc(p.name)+'" onchange="db.profile.name=this.value;save()" />'+
    '<label class="label">Meta (cambia el color)</label><div class="col" style="gap:8px">'+
    Object.keys(GOALS).map(function(k){ var g=GOALS[k]
      return '<button class="goal-btn'+(p.goal===k?' sel':'')+'" style="--gc:'+g.color+'" onclick="pickGoal(\''+k+'\')">'+g.emoji+' '+g.label+'</button>' }).join('')+
    '</div><label class="label">Días por semana (meta)</label>'+
    '<input class="input" type="number" min="1" max="7" value="'+p.weeklyTarget+'" onchange="db.profile.weeklyTarget=Number(this.value)||4;save()" /></div>'+
    '<div class="card"><h3 class="mb">Datos</h3>'+
    '<button class="btn secondary mb" onclick="exportJSON()">Exportar respaldo JSON</button>'+
    '<button class="btn danger" onclick="wipe()">Borrar todos los datos</button>'+
    '<p class="tiny mt">Este respaldo se puede importar en la versión completa (React + Supabase) desde Perfil → Importar.</p></div>'+
    '<p class="tiny" style="text-align:center">Gym Squad Local · los datos viven solo en este dispositivo</p>'
}
function exportJSON() {
  var data = { version:1,
    exercises: [], routines: [],
    sessions: db.sessions.map(function(s){ return { date:s.date, dayName:s.dayName,
      sets: s.sets.map(function(st){ return { exercise:st.ex, weight:st.weight, reps:st.reps, unit:'lb' } }) } }),
    runs: db.runs }
  var a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}))
  a.download = 'gym-squad-respaldo.json'; a.click()
}
function wipe() {
  if (confirm('¿Seguro? Se borra todo lo guardado en este teléfono.')) {
    localStorage.removeItem('gym-squad-local'); location.reload()
  }
}

applyAccent()
render()
</script>
